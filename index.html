<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tırsan Dijital Pasaport</title>
</head>

<body>

<h1>Tırsan Dijital Araç Pasaportu</h1>

<p id="info">Yükleniyor...</p>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const vehicles = {
  "TR001": {
    model: "Tanker",
    sasi: "Silo",
    malzeme: "Alüminyum",
    agirlik: "8200 kg",
    test: "Kalite kontrol: Geçti",
    operator: "Operatör: #124"
    tasarimci: "Omer Faruk AYDOGAN"

  },
  "TR002": {
    model: "Lowbed",
    sasi: "Çelik",
    malzeme: "Çelik",
    agirlik: "12000 kg",
    test: "Kalite kontrol: Geçti",
    operator: "Operatör: #124"
  },
  "TR003": {
    model: "Tenteli",
    sasi: "Standart",
    malzeme: "Çelik",
    agirlik: "9500 kg",
    test: "Kalite kontrol: Geçti",
    operator: "Operatör: #124"
  }
};

if (vehicles[id]) {
  document.getElementById("info").innerHTML =
    "<b>Araç ID:</b> " + id + "<br>" +
    "<b>Model:</b> " + vehicles[id].model + "<br>" +
    "<b>Şasi:</b> " + vehicles[id].sasi + "<br>" +
    "<b>Malzeme:</b> " + vehicles[id].malzeme + "<br>" +
    "<b>Ağırlık:</b> " + vehicles[id].agirlik;
    "<b>" + vehicles[id].test + "</b><br>" +
    "<b>" + vehicles[id].operator + "</b>";
    "<b>" + vehicles[id].tasarimci + "</b>"; 
} else {
  document.getElementById("info").innerHTML = "Araç bulunamadı!";
}
</script>

</body>
</html>
